version: 2

updates:
  # Root workspace — pnpm (reported as npm ecosystem to Dependabot)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript

  # Desktop app — pnpm
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript

  # packages/ai-runtime — pnpm
  - package-ecosystem: npm
    directory: /packages/ai-runtime
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript

  # packages/mcp-client — pnpm
  - package-ecosystem: npm
    directory: /packages/mcp-client
    schedule:
      interval: weekly
      day: monday
