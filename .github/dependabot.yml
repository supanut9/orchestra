      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript

  # packages/memory — pnpm
  - package-ecosystem: npm
    directory: /packages/memory
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels:
      - dependencies
