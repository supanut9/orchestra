name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — Apple Silicon (Intel macs will fall back to Rosetta)
          - platform: macos-aarch64
            runner: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin

          # Linux — deb + AppImage
          - platform: linux-x86_64
            runner: ubuntu-latest
            args: ''
            rust_target: ''

          # Windows — msi
          - platform: windows-x86_64
            runner: windows-latest
            args: ''
            rust_target: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts && pnpm rebuild

      - name: Build workspace packages
        run: pnpm --filter './packages/*' build

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Code-signing is intentionally skipped for v0.1 — the workflow
          # ships unsigned artifacts. macOS users right-click → Open on first
          # launch; Windows users accept the SmartScreen warning. Signed
          # builds will be reintroduced post-v0.1 once we have an Apple
          # Developer ID + Windows certificate. Configure the relevant
          # secrets (APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY, APPLE_ID,
          # APPLE_PASSWORD, APPLE_TEAM_ID, TAURI_SIGNING_PRIVATE_KEY,
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD) and re-add them here.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Orchestra ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          projectPath: apps/desktop
          args: ${{ matrix.args }}
