[package]
name = "orchestra-desktop"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"

[lib]
name = "orchestra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "orchestra-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "^2.0", features = [] }

[dependencies]
tauri            = { version = "^2.1", features = ["macos-private-api"] }
tauri-plugin-shell  = "^2.0"
tauri-plugin-fs     = "^2.0"
tauri-plugin-store  = "^2.1"
tauri-plugin-dialog = "^2.0"

serde            = { version = "^1", features = ["derive"] }
serde_json       = "^1"
tokio            = { version = "^1.42", features = ["full"] }
anyhow           = "^1"
thiserror        = "^2"
tracing          = "^0.1"
tracing-subscriber = { version = "^0.3", features = ["env-filter"] }

# PTY — Wezterm's cross-platform portable-pty (includes Windows ConPTY)
# Published latest is 0.8.x on crates.io; bump to ^0.9 once it ships.
portable-pty  = "^0.8"

# File watching
notify = "^8"

# Git worktree management
git2 = "^0.19"

# Local memory store (sqlite-vec will be added by Lane C)
rusqlite = { version = "^0.32", features = ["bundled"] }

# Utilities
uuid        = { version = "^1", features = ["v4", "serde"] }
dashmap     = "^6"
base64      = "^0.22"
serde_yaml  = "^0.9"
shell-words = "^1"

[dev-dependencies]
tempfile = "^3"

# tauri-specta for TypeScript type generation (optional at scaffold time)
# specta              = { version = "^2.0.0-rc", optional = true }
# tauri-specta        = { version = "^2.0.0-rc", features = ["derive", "typescript"], optional = true }
# specta-typescript   = { version = "^0.0.7", optional = true }

[features]
# Tauri custom protocol for dev
custom-protocol = ["tauri/custom-protocol"]
